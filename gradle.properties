org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric versions, verified 2026-11-21 against meta.fabricmc.net and maven.fabricmc.net
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19.4
fabric_api_version=0.166.2+26.3

# Kotlin, verified 2026-11-26: Fabric Language Kotlin 1.14.2+kotlin.2.4.21 (maven.fabricmc.net, Modrinth lists
# 26.3; published 2026-10-09) bundles Kotlin 2.4.21, so the compiler uses exactly that version (Gradle Plugin
# Portal and Maven Central, 2026-10-08).
kotlin_version=2.4.21
fabric_kotlin_version=1.14.2+kotlin.2.4.21

# Test dependencies, verified 2026-11-21 against Maven Central (latest JUnit 5.x)
junit_version=5.14.4

# Shared by every module. Mod versions and artifact names live in each module's own gradle.properties;
# the root project is an aggregator with no publishable version.
maven_group=io.github.brener_fregulia
